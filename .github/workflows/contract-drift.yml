name: contract-drift

# Spec "kontrakt najpierw" D2b (Tribunedesk/tribunedesk-cms-kit, docs/specs/2026-11-13-...):
# once a day, compare tests/fixtures/contract/VERSION with the newest tag of
# Tribunedesk/tribunedesk-cms-api. When the pin is behind, move it (VERSION, the signature
# vectors, ContractVersion::TESTED, the guide links in README.md) on the branch contract/latest,
# open or update one pull request, start CI on it, and fail this run: a pin left behind stays red
# every day. The pull request never merges itself; main lands through /land, and landing it does
# not release the library: a vX.Y.Z tag is a separate decision.
#
# GITHUB_TOKEN only. It may not push changes under .github/workflows/; the pin lives outside it.
# CI is started with `gh workflow run` (workflow_dispatch is the exception GitHub allows); the
# `pull_request` run of a push made with it waits in `action_required` until someone approves
# it, so the last step approves the runs of the commit it pushed. Opening the pull request
# needs the repository setting "Allow GitHub Actions to create and approve pull requests".
# While its pull request is open, the branch is rebuilt only when a newer tag replaces one it
# pins, and then ci/drift-branch.sh carries the commits pushed onto it onto the rebuilt branch.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: contract-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # ci/drift-branch.sh finds where the open branch left main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Only an open pull request keeps its branch: a branch left behind by a closed pull request,
      # or by a run whose `gh pr create` failed, is rebuilt and the pull request opened again.
      - name: The pin on contract/latest, if its pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list --head contract/latest --state open --json number --jq '.[0].number')"
          if [ -n "$open" ] && git fetch --quiet origin contract/latest 2>/dev/null; then
            echo "pin=$(git show FETCH_HEAD:tests/fixtures/contract/VERSION 2>/dev/null)" >> "$GITHUB_OUTPUT"
          else
            echo "pin=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the pin with the newest tag
        id: drift
        env:
          OPEN_PR_PIN: ${{ steps.open.outputs.pin }}
        run: php ci/contract-drift.php --body-out "$RUNNER_TEMP/body.md" --open-pr-pin "$OPEN_PR_PIN"

      - name: Push contract/latest, open the pull request, start CI
        if: steps.drift.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.drift.outputs.pinned }}
          TAG: ${{ steps.drift.outputs.tag }}
        run: |
          branch="contract/latest"
          title="contract: $PINNED → $TAG"
          open="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          # Commits pushed onto an open pull request's branch are carried, not dropped.
          OPEN_PR="$open" bash ci/drift-branch.sh "$title" tests/fixtures/contract src/ContractVersion.php README.md
          # A failed `gh pr create` (2026-11-25: a GraphQL error) used to leave a run as red as a plain
          # "pin behind", so nobody saw that no pull request existed. Three tries, then an error that
          # says so; the morning loop of the harness also reports a red run with no open pull request.
          pr_ok=""
          for try in 1 2 3; do
            if [ -z "$open" ]; then
              gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md" && pr_ok=1 && break
            else
              gh pr edit "$open" --title "$title" --body-file "$RUNNER_TEMP/body.md" && pr_ok=1 && break
            fi
            [ "$try" -lt 3 ] && sleep 20
          done
          if [ -z "$pr_ok" ]; then
            msg="$branch was pushed, but its pull request was NOT opened or updated: open it by hand (gh pr create --base main --head $branch) or run this workflow again"
            echo "::error::$msg"
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"

      - name: Approve the pull request's runs of the pushed commit
        if: steps.drift.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          ids=""
          for _ in $(seq 1 12); do
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')"
            [ -n "$ids" ] && break
            sleep 5
          done
          [ -z "$ids" ] && echo "no pull_request run of $sha waits for approval"
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" \
              || echo "::warning::could not approve run $id: approve it in the Actions tab"
          done

      - name: Stay red while the pin is behind
        if: steps.drift.outputs.behind == 'true'
        env:
          PINNED: ${{ steps.drift.outputs.pinned }}
          TAG: ${{ steps.drift.outputs.tag }}
        run: |
          echo "::error::tests/fixtures/contract/VERSION $PINNED is behind $TAG: land the contract/latest pull request"
          exit 1
